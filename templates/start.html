<!DOCTYPE html>
<html>
<head>
    <title>AI FACE PAY</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- 시작 화면 -->
<div class="main-box" id="startBox">

    <h1 class="title">AI FACE PAY</h1>
    <h2 class="subtitle">미래형 핀테크 투자 체험</h2>

    <button id="startBtn" class="main-button">
        주식 매수 시작
    </button>

</div>

<!-- FacePay 인증 화면 -->
<div class="main-box" id="authBox" style="display:none">

    <h1 class="title" id="authEmoji">FacePay 인증</h1>
    <h2 class="subtitle">얼굴을 카메라에 가까이 대세요</h2>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none" width="640" height="480"></canvas>

    <h2 id="authStatus" class="subtitle">인식중...</h2>

    <button id="skipBtn" class="skip-button" style="display:none">
        카메라 없이 계속하기
    </button>

</div>

<script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
